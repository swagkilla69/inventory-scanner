<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;max-width:620px;margin:20px auto;padding:0 14px;color:#202124;background:#f7f8fa}
.panel{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}
h1{font-size:24px}
h2{font-size:19px;margin:4px 0 12px}
label{display:block;font-weight:bold;margin:10px 0 5px}
input,select,textarea,button{font:inherit;width:100%;padding:11px;border:1px solid #bbb;border-radius:8px;margin:4px 0}
button{background:#1a73e8;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#5f6368}
button.danger{background:#b3261e}
button:disabled{opacity:.5}
small,.muted{color:#666}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.hidden{display:none!important}
#reader{width:100%;margin-top:10px}
.itemtitle{font-size:21px;font-weight:bold}
.batch{border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0}
.status{padding:9px;border-radius:8px;background:#eef3fd;margin:8px 0;white-space:pre-wrap}
.checkline{display:flex;align-items:center;gap:8px;font-weight:normal}
.checkline input{width:auto}
img{max-width:100%;max-height:180px;object-fit:contain}
</style>
</head>
<body>

<h1>Inventory Scanner</h1>
<div id="status" class="status">Ready.</div>

<section id="loginPanel" class="panel">
  <h2>Sign in</h2>
  <label for="pin">Four-digit PIN</label>
  <input
    id="pin"
    type="password"
    inputmode="numeric"
    pattern="[0-9]*"
    maxlength="4"
    autocomplete="one-time-code"
    placeholder="••••"
  >
  <button onclick="login()">Log In</button>
</section>

<section id="app" class="hidden">

  <div class="panel">
    <div class="row">
      <div><b id="welcome"></b></div>
      <button class="secondary" onclick="logout()">Log Out</button>
    </div>

    <label for="barcode">Enter barcode manually</label>
    <div class="row">
      <input id="barcode" placeholder="Barcode">
      <button onclick="findItem()">Find Item</button>
    </div>

    <div class="row">
      <button onclick="startCamera()">Open Camera Scanner</button>
      <button class="secondary" onclick="stopCamera()">Stop Camera</button>
    </div>

    <div id="reader"></div>
  </div>

  <div id="itemPanel" class="panel hidden">
    <div class="itemtitle" id="itemName"></div>
    <div id="itemDetails"></div>
    <div id="profileView"></div>

    <h2>Batches</h2>
    <div id="batches"></div>

    <div id="stockPanel" class="hidden">
      <h2>Stock transaction</h2>

      <label>Selected batch</label>
      <select id="batchSelect"></select>

      <label>Action</label>
      <select id="txnType">
        <option value="Receive">Receive stock</option>
        <option value="Remove">Remove stock</option>
      </select>

      <label>Quantity</label>
      <input id="txnQty" type="number" min="1" step="1">

      <label>Reason</label>
      <input id="txnReason" placeholder="Reason">

      <button onclick="submitTransaction()">Submit transaction</button>
    </div>

    <div id="newBatchPanel" class="hidden">
      <h2>Create new batch</h2>

      <label>Lot / batch number</label>
      <input id="newLot">

      <div class="row">
        <div>
          <label>Date received</label>
          <input id="newReceived" type="date">
        </div>
        <div>
          <label>Expiration date</label>
          <input id="newExpiration" type="date">
        </div>
      </div>

      <label>Starting quantity</label>
      <input id="newQuantity" type="number" min="1" step="1">

      <label>Supplier</label>
      <input id="newSupplier">

      <label>Location</label>
      <input id="newLocation">

      <label>Notes</label>
      <textarea id="newNotes"></textarea>

      <button onclick="createBatch()">Create batch</button>
    </div>

    <div id="profilePanel" class="hidden">
      <h2>Edit item profile</h2>

      <label>Uses</label>
      <textarea id="pUses"></textarea>

      <label>Warnings / contraindications</label>
      <textarea id="pWarnings"></textarea>

      <label>Instructions</label>
      <textarea id="pInstructions"></textarea>

      <label>Special handling</label>
      <textarea id="pHandling"></textarea>

      <label>Profile notes</label>
      <textarea id="pNotes"></textarea>

      <label>Photo URL</label>
      <input id="pPhoto">

      <button onclick="saveProfile()">Save profile</button>
    </div>
  </div>

  <div id="usersPanel" class="panel hidden">
    <h2>Owner — User Management</h2>
    <div id="usersList"></div>

    <h2>Add / edit account</h2>

    <label>Email address (account contact, not used to log in)</label>
    <input id="uEmail" type="email">

    <label>Display name</label>
    <input id="uName">

    <label>PIN (leave blank to keep existing PIN)</label>
    <input id="uPin" inputmode="numeric" maxlength="4" type="password">

    <label class="checkline">
      <input id="uActive" type="checkbox">
      Account active
    </label>

    <div id="permissionInputs"></div>

    <button onclick="saveUser()">Save user</button>
  </div>

</section>

<script>
const API_URL =
  'https://script.google.com/macros/s/AKfycbyLBxzGHD23XGf5stPlHvWZ2E_Rvo6Bg0i23bcmtY2eLHAb9iRTA3NEHOByaNaCwCTuCg/exec';

const SESSION_KEY = 'inventory_session';

let token = sessionStorage.getItem(SESSION_KEY) || '';
let currentUser = null;
let currentItem = null;
let scanner = null;
let currentPermissions = {};

const $ = id => document.getElementById(id);

function status(s) {
  $('status').textContent = s;
}

function requestId() {
  return 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/[x]/g, function() {
    return Math.floor(Math.random() * 16).toString(16);
  });
}

/*
 * Apps Script communication.
 * Uses JSONP rather than the previous hidden-iframe bridge.
 */
function api(action, data = {}) {
  return new Promise(function(resolve, reject) {
    const nonce = requestId();
    const callbackName = 'inventoryCallback_' + nonce;
    const script = document.createElement('script');

    let finished = false;

    const timer = setTimeout(function() {
      finish(new Error(
        'Server timed out. Check that the latest Apps Script deployment is active, then try again.'
      ));
    }, 30000);

    function finish(error, result) {
      if (finished) return;

      finished = true;
      clearTimeout(timer);

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      if (error) {
        reject(error);
      } else {
        resolve(result);
      }
    }

    window[callbackName] = function(message) {
      if (!message || message.nonce !== nonce) {
        finish(new Error('The server returned an invalid response.'));
        return;
      }

      finish(
        null,
        message.result || {
          success: false,
          message: 'The server returned an empty response.'
        }
      );
    };

    script.onerror = function() {
      finish(new Error(
        'Could not reach the Apps Script server. Check the web app deployment and internet connection.'
      ));
    };

    const payload = JSON.stringify({
      action: action,
      data: data,
      nonce: nonce
    });

    script.src =
      API_URL +
      '?payload=' + encodeURIComponent(payload) +
      '&callback=' + encodeURIComponent(callbackName);

    document.head.appendChild(script);
  });
}

/* ---------- Login and session ---------- */

async function login() {
  const pin = $('pin').value.trim();

  if (!/^\d{4}$/.test(pin)) {
    status('Enter your four-digit PIN.');
    return;
  }

  try {
    status('Signing in…');

    const r = await api('login', { pin: pin });

    if (!r.success) {
      throw new Error(r.message);
    }

    token = r.token;
    sessionStorage.setItem(SESSION_KEY, token);

    currentUser = r;
    currentPermissions = r.permissions || {};

    showApp();
    status('Signed in.');
    $('pin').value = '';
  } catch (e) {
    status(e.message);
  }
}

async function validate() {
  if (!token) {
    showLogin();
    return;
  }

  try {
    const r = await api('validate', { token: token });

    if (!r.success) {
      throw new Error(r.message);
    }

    currentUser = r;
    currentPermissions = r.permissions || {};

    showApp();
  } catch (e) {
    sessionStorage.removeItem(SESSION_KEY);
    token = '';
    showLogin();
    status(e.message);
  }
}

function showLogin() {
  $('loginPanel').classList.remove('hidden');
  $('app').classList.add('hidden');
}

function showApp() {
  $('loginPanel').classList.add('hidden');
  $('app').classList.remove('hidden');

  $('welcome').textContent =
    'Logged in as ' + (currentUser.displayName || 'User');

  $('stockPanel').classList.toggle(
    'hidden',
    !(currentPermissions.receive || currentPermissions.remove)
  );

  $('newBatchPanel').classList.toggle(
    'hidden',
    !currentPermissions.createBatches
  );

  $('profilePanel').classList.toggle(
    'hidden',
    !currentPermissions.editProfiles
  );

  $('usersPanel').classList.toggle(
    'hidden',
    !currentPermissions.manageUsers
  );

  if (currentPermissions.manageUsers) {
    loadUsers();
  }
}

async function logout() {
  try {
    await api('logout', { token: token });
  } catch (e) {}

  token = '';
  sessionStorage.removeItem(SESSION_KEY);

  currentUser = null;
  currentItem = null;

  stopCamera();

  $('itemPanel').classList.add('hidden');

  showLogin();
  status('Logged out.');
}

/* ---------- Item lookup ---------- */

async function findItem(value) {
  const barcode = String(value || $('barcode').value).trim();

  if (!barcode) {
    status('Enter a barcode.');
    return;
  }

  if (!currentPermissions.scan) {
    status('Your account cannot scan or look up items.');
    return;
  }

  try {
    status('Looking up item…');

    const r = await api('lookup', {
      barcode: barcode,
      token: token
    });

    if (!r.success) {
      throw new Error(r.message);
    }

    renderItem(r);
    status('Item found.');
  } catch (e) {
    status(e.message);
  }
}

function renderItem(r) {
  currentItem = r;

  $('itemPanel').classList.remove('hidden');
  $('itemName').textContent = r.item.name || 'Unnamed item';

  $('itemDetails').innerHTML =
    '<p>' +
    '<b>Item ID:</b> ' + esc(r.item.id) + '<br>' +
    '<b>Barcode:</b> ' + esc(r.item.barcode) + '<br>' +
    '<b>Entered:</b> ' + esc(r.item.dateEntered) + '<br>' +
    '<b>On hand:</b> ' + esc(r.item.onHand) + ' ' +
      esc(r.item.unit || '') + '<br>' +
    '<b>Category:</b> ' + esc(r.item.category || '') + '<br>' +
    '<b>Manufacturer:</b> ' + esc(r.item.manufacturer || '') + '<br>' +
    '<b>Location:</b> ' + esc(r.item.location || '') + '<br>' +
    '<b>Notes:</b> ' + esc(r.item.notes || '') +
    '</p>';

  const p = r.profile || {};

  $('profileView').innerHTML =
    '<h2>Profile</h2>' +
    (p.photoUrl
      ? '<img src="' + esc(p.photoUrl) + '" alt="Item photo">'
      : '') +
    '<p>' +
    '<b>Uses:</b> ' + esc(p.uses || '') + '<br>' +
    '<b>Warnings:</b> ' + esc(p.warnings || '') + '<br>' +
    '<b>Instructions:</b> ' + esc(p.instructions || '') + '<br>' +
    '<b>Special handling:</b> ' + esc(p.handling || '') + '<br>' +
    '<b>Profile notes:</b> ' + esc(p.notes || '') +
    '</p>';

  $('batches').innerHTML = '';
  $('batchSelect').innerHTML = '';

  (r.batches || []).forEach(function(b) {
    const d = document.createElement('div');
    d.className = 'batch';

    d.innerHTML =
      '<b>' + esc(b.lot || b.id) + '</b><br>' +
      'Batch ID: ' + esc(b.id) + '<br>' +
      'Expires: ' + esc(b.expiration || 'Not entered') + '<br>' +
      'Quantity: ' + esc(b.quantity) + '<br>' +
      'Status: ' + esc(b.status || '') + '<br>' +
      'Barcode: ' + esc(b.barcode || '');

    $('batches').appendChild(d);

    const o = document.createElement('option');
    o.value = b.id;

    o.textContent =
      (b.lot || b.id) +
      ' — ' + b.quantity + ' on hand' +
      (b.expiration ? ' — exp ' + b.expiration : '');

    if (b.selected) {
      o.selected = true;
    }

    $('batchSelect').appendChild(o);
  });

  if (r.selectedBatchId) {
    $('batchSelect').value = r.selectedBatchId;
  }

  $('txnType').innerHTML = '';

  if (currentPermissions.receive) {
    $('txnType').add(new Option('Receive stock', 'Receive'));
  }

  if (currentPermissions.remove) {
    $('txnType').add(new Option('Remove stock', 'Remove'));
  }

  if (currentPermissions.receive || currentPermissions.remove) {
    $('stockPanel').classList.remove('hidden');
  } else {
    $('stockPanel').classList.add('hidden');
  }

  $('newLot').value = '';
  $('newQuantity').value = '';
  $('newReceived').value = new Date().toISOString().slice(0, 10);

  $('pUses').value = p.uses || '';
  $('pWarnings').value = p.warnings || '';
  $('pInstructions').value = p.instructions || '';
  $('pHandling').value = p.handling || '';
  $('pNotes').value = p.notes || '';
  $('pPhoto').value = p.photoUrl || '';
}

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c];
  });
}

/* ---------- Stock transactions ---------- */

async function submitTransaction() {
  if (!currentItem) return;

  const type = $('txnType').value;
  const qty = Number($('txnQty').value);
  const batchId = $('batchSelect').value;

  if (!batchId) {
    status('Select a specific batch before changing stock.');
    return;
  }

  if (!Number.isSafeInteger(qty) || qty <= 0) {
    status('Enter a positive whole-number quantity.');
    return;
  }

  try {
    status('Saving stock transaction…');

    const r = await api('transaction', {
      token: token,
      request: {
        itemId: currentItem.item.id,
        batchId: batchId,
        type: type,
        quantity: qty,
        reason: $('txnReason').value,
        requestId: requestId()
      }
    });

    if (!r.success) {
      throw new Error(r.message);
    }

    status(r.message);
    await findItem(currentItem.item.barcode);
  } catch (e) {
    status(e.message);
  }
}

/* ---------- New batch ---------- */

async function createBatch() {
  if (!currentItem) return;

  const qty = Number($('newQuantity').value);

  if (!Number.isSafeInteger(qty) || qty <= 0) {
    status('Enter a positive whole-number quantity.');
    return;
  }

  try {
    status('Creating batch…');

    const r = await api('newBatch', {
      token: token,
      request: {
        itemId: currentItem.item.id,
        lot: $('newLot').value,
        receivedDate: $('newReceived').value,
        expirationDate: $('newExpiration').value,
        quantity: qty,
        supplier: $('newSupplier').value,
        location: $('newLocation').value,
        notes: $('newNotes').value,
        requestId: requestId()
      }
    });

    if (!r.success) {
      throw new Error(r.message);
    }

    status(r.message + ' Batch barcode: ' + r.batchBarcode);
    await findItem(currentItem.item.barcode);
  } catch (e) {
    status(e.message);
  }
}

/* ---------- Item profile ---------- */

async function saveProfile() {
  if (!currentItem) return;

  try {
    const r = await api('profileSave', {
      token: token,
      request: {
        itemId: currentItem.item.id,
        uses: $('pUses').value,
        warnings: $('pWarnings').value,
        instructions: $('pInstructions').value,
        handling: $('pHandling').value,
        notes: $('pNotes').value,
        photoUrl: $('pPhoto').value
      }
    });

    if (!r.success) {
      throw new Error(r.message);
    }

    status(r.message);
    await findItem(currentItem.item.barcode);
  } catch (e) {
    status(e.message);
  }
}

/* ---------- Camera scanner ---------- */

async function startCamera() {
  try {
    if (!scanner) {
      scanner = new Html5Qrcode('reader');
    }

    const cams = await Html5Qrcode.getCameras();

    if (!cams.length) {
      throw new Error('No camera was found.');
    }

    await scanner.start(
      cams[0].id,
      {
        fps: 10,
        qrbox: { width: 250, height: 180 }
      },
      function(txt) {
        stopCamera();
        $('barcode').value = txt;
        findItem(txt);
      },
      function() {}
    );

    status('Camera scanning.');
  } catch (e) {
    status('Camera error: ' + e.message);
  }
}

async function stopCamera() {
  if (scanner) {
    try {
      if (scanner.isScanning) {
        await scanner.stop();
      }
    } catch (e) {}

    try {
      await scanner.clear();
    } catch (e) {}
  }
}

/* ---------- Owner user management ---------- */

async function loadUsers() {
  try {
    const r = await api('usersList', { token: token });

    if (!r.success) {
      throw new Error(r.message);
    }

    $('usersList').innerHTML = '';

    r.users.forEach(function(u) {
      const d = document.createElement('div');
      d.className = 'batch';

      d.innerHTML =
        '<b>' + esc(u.displayName) + '</b> — ' +
        esc(u.email) + '<br>' +
        'Role: ' + esc(u.role) + ' | ' +
        (u.active ? 'Active' : 'Inactive') +
        '<br><button class="secondary" type="button">Edit this account</button>';

      d.querySelector('button').onclick = function() {
        editUser(u);
      };

      $('usersList').appendChild(d);
    });
  } catch (e) {
    status(e.message);
  }
}

let editingUserEmail = '';

function editUser(u) {
  editingUserEmail = u.email;

  $('uEmail').value = u.email;
  $('uEmail').disabled = true;

  $('uName').value = u.displayName;
  $('uPin').value = '';
  $('uActive').checked = u.active;

  Object.keys(PERMISSION_COLUMNS_JS).forEach(function(k) {
    const el = $('perm_' + k);

    if (el) {
      el.checked = !!u.permissions[k];
    }
  });
}

const PERMISSION_COLUMNS_JS = {
  scan: 'Can scan / look up items',
  receive: 'Receive stock',
  remove: 'Remove stock',
  createBatches: 'Create new batches',
  editProfiles: 'Edit item profiles'
};

$('permissionInputs').innerHTML =
  Object.entries(PERMISSION_COLUMNS_JS).map(function(entry) {
    const k = entry[0];
    const v = entry[1];

    return '<label class="checkline">' +
      '<input type="checkbox" id="perm_' + k + '"> ' +
      v +
      '</label>';
  }).join('');

async function saveUser() {
  const permissions = {};

  Object.keys(PERMISSION_COLUMNS_JS).forEach(function(k) {
    permissions[k] = $('perm_' + k).checked;
  });

  try {
    const r = await api('userSave', {
      token: token,
      request: {
        email: $('uEmail').value,
        displayName: $('uName').value,
        pin: $('uPin').value,
        active: $('uActive').checked,
        permissions: permissions
      }
    });

    if (!r.success) {
      throw new Error(r.message);
    }

    status(r.message);

    editingUserEmail = '';

    $('uEmail').disabled = false;
    $('uEmail').value = '';
    $('uName').value = '';
    $('uPin').value = '';

    loadUsers();
  } catch (e) {
    status(e.message);
  }
}

/* ---------- Startup ---------- */

$('pin').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    login();
  }
});

validate();
</script>
</body>
</html>
