<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;max-width:620px;margin:20px auto;padding:0 14px;color:#202124;background:#f7f8fa}
.panel{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}
h1{font-size:24px}
h2{font-size:19px;margin:4px 0 12px}
label{display:block;font-weight:bold;margin:10px 0 5px}
input,select,textarea,button{font:inherit;width:100%;padding:11px;border:1px solid #bbb;border-radius:8px;margin:4px 0}
button{background:#1a73e8;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#5f6368}
button.danger{background:#b3261e}
button:disabled{opacity:.5}
small,.muted{color:#666}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.hidden{display:none!important}
#reader{width:100%;margin-top:10px}
.itemtitle{font-size:21px;font-weight:bold}
.batch{border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0}
.status{padding:9px;border-radius:8px;background:#eef3fd;margin:8px 0;white-space:pre-wrap}
.checkline{display:flex;align-items:center;gap:8px;font-weight:normal}
.checkline input{width:auto}
img{max-width:100%;max-height:180px;object-fit:contain}
</style>
</head>
<body>

<h1>Inventory Scanner</h1>
<div id="status" class="status">Ready.</div>

<section id="loginPanel" class="panel">
  <h2>Sign in</h2>
  <label for="pin">Four-digit PIN</label>
  <input
    id="pin"
    type="password"
    inputmode="numeric"
    pattern="[0-9]*"
    maxlength="4"
    autocomplete="one-time-code"
    placeholder="••••"
  >
  <button onclick="login()">Log In</button>
</section>

<section id="app" class="hidden">

  <div class="panel">
    <div class="row">
      <div><b id="welcome"></b></div>
      <button class="secondary" onclick="logout()">Log Out</button>
    </div>

    <label for="barcode">Enter barcode manually</label>
    <div class="row">
      <input id="barcode" placeholder="Barcode">
      <button onclick="findItem()">Find Item</button>
    </div>

    <div class="row">
      <button onclick="startCamera()">Open Camera Scanner</button>
      <button class="secondary" onclick="stopCamera()">Stop Camera</button>
    </div>

    <div id="reader"></div>
  </div>

  <div id="itemPanel" class="panel hidden">
    <div class="itemtitle" id="itemName"></div>
    <div id="itemDetails"></div>
    <div id="profileView"></div>

    <h2>Batches</h2>
    <div id="batches"></div>

    <div id="stockPanel" class="hidden">
      <h2>Stock transaction</h2>

      <label>Selected batch</label>
      <select id="batchSelect"></select>

      <label>Action</label>
      <select id="txnType">
        <option value="Receive">Receive stock</option>
        <option value="Remove">Remove stock</option>
      </select>

      <label>Quantity</label>
      <input id="txnQty" type="number" min="1" step="1">

      <label>Reason</label>
      <input id="txnReason" placeholder="Reason">

      <button onclick="submitTransaction()">Submit transaction</button>
    </div>

    <div id="newBatchPanel" class="hidden">
      <h2>Create new batch</h2>

      <label>Lot / batch number</label>
      <input id="newLot">

      <div class="row">
        <div>
          <label>Date received</label>
          <input id="newReceived" type="date">
        </div>
        <div>
          <label>Expiration date</label>
          <input id="newExpiration" type="date">
        </div>
      </div>

      <label>Starting quantity</label>
      <input id="newQuantity" type="number" min="1" step="1">

      <label>Supplier</label>
      <input id="newSupplier">

      <label>Location</label>
      <input id="newLocation">

      <label>Notes</label>
      <textarea id="newNotes"></textarea>

      <button onclick="createBatch()">Create batch</button>
    </div>

    <div id="profilePanel" class="hidden">
      <h2>Edit item profile</h2>

      <label>Uses</label>
      <textarea id="pUses"></textarea>

      <label>Warnings / contraindications</label>
      <textarea id="pWarnings"></textarea>

      <label>Instructions</label>
      <textarea id="pInstructions"></textarea>

      <label>Special handling</label>
      <textarea id="pHandling"></textarea>

      <label>Profile notes</label>
      <textarea id="pNotes"></textarea>

      <label>Photo URL</label>
      <input id="pPhoto">

      <button onclick="saveProfile()">Save profile</button>
    </div>
  </div>

  <div id="usersPanel" class="panel hidden">
    <h2>Owner — User Management</h2>
    <div id="usersList"></div>

    <h2>Add / edit account</h2>

    <label>Email address (account contact, not used to log in)</label>
    <input id="uEmail" type="email">

    <label>Display name</label>
    <input id="uName">

    <label>PIN (leave blank to keep existing PIN)</label>
    <input id="uPin" inputmode="numeric" maxlength="4" type="password">

    <label class="checkline">
      <input id="uActive" type="checkbox">
      Account active
    </label>

    <div id="permissionInputs"></div>

    <button onclick="saveUser()">Save user</button>
  </div>

</section>

<script>
const API_URL =
  'https://script.google.com/macros/s/AKfycbyLBxzGHD23XGf5stPlHvWZ2E_Rvo6Bg0i23bcmtY2eLHAb9iRTA3NEHOByaNaCwCTuCg/exec';

const SESSION_KEY = 'inventory_session';

let token = sessionStorage.getItem(SESSION_KEY) || '';
let currentUser = null;
let currentItem = null;
let scanner = null;
let currentPermissions = {};

const $ = function(id) {
  return document.getElementById(id);
};

function status(message) {
  $('status').textContent = message;
}

function requestId() {
  return 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/[x]/g, function() {
    return Math.floor(Math.random() * 16).toString(16);
  });
}

function api(action, data) {
  data = data || {};

  return new Promise(function(resolve, reject) {
    const nonce = requestId();
    const frame = document.createElement('iframe');
    const form = document.createElement('form');

    frame.name = 'api_' + nonce;
    frame.style.display = 'none';

    form.method = 'POST';
    form.action = API_URL;
    form.target = frame.name;
    form.style.display = 'none';

    const field = document.createElement('input');
    field.name = 'payload';
    field.value = JSON.stringify({
      action: action,
      data: data,
      nonce: nonce
    });

    form.appendChild(field);

    const timer = setTimeout(function() {
      cleanup();
      reject(new Error('Server timed out. Please try again.'));
    }, 25000);

    function cleanup() {
      clearTimeout(timer);
      window.removeEventListener('message', listener);
      form.remove();
      frame.remove();
    }

    function listener(event) {
      if (
        ![
          'https://script.google.com',
          'https://script.googleusercontent.com'
        ].includes(event.origin)
      ) {
        return;
      }

      const message = event.data;

      if (
        !message ||
        message.nonce !== nonce ||
        !message.data
      ) {
        return;
      }

      cleanup();

      try {
        const bytes = Uint8Array.from(
          atob(message.data),
          function(character) {
            return character.charCodeAt(0);
          }
        );

        resolve(
          JSON.parse(new TextDecoder().decode(bytes))
        );
      } catch (error) {
        reject(error);
      }
    }

    window.addEventListener('message', listener);
    document.body.appendChild(frame);
    document.body.appendChild(form);
    form.submit();
  });
}

/* ================= LOGIN ================= */

async function login() {
  const pin = $('pin').value.trim();

  if (!/^\d{4}$/.test(pin)) {
    status('Enter your four-digit PIN.');
    return;
  }

  try {
    status('Signing in…');

    // PIN ONLY. No email is sent.
    const result = await api('login', { pin: pin });

    if (!result.success) {
      throw new Error(result.message);
    }

    token = result.token;
    sessionStorage.setItem(SESSION_KEY, token);

    currentUser = result;
    currentPermissions = result.permissions || {};

    $('pin').value = '';

    showApp();
    status('Signed in.');
  } catch (error) {
    status(error.message);
  }
}

async function validate() {
  if (!token) {
    showLogin();
    return;
  }

  try {
    const result = await api('validate', { token: token });

    if (!result.success) {
      throw new Error(result.message);
    }

    currentUser = result;
    currentPermissions = result.permissions || {};

    showApp();
  } catch (error) {
    sessionStorage.removeItem(SESSION_KEY);
    token = '';
    showLogin();
    status(error.message);
  }
}

function showLogin() {
  $('loginPanel').classList.remove('hidden');
  $('app').classList.add('hidden');
}

function showApp() {
  $('loginPanel').classList.add('hidden');
  $('app').classList.remove('hidden');

  $('welcome').textContent =
    'Logged in as ' + (currentUser.displayName || 'User');

  $('stockPanel').classList.toggle(
    'hidden',
    !(currentPermissions.receive || currentPermissions.remove)
  );

  $('newBatchPanel').classList.toggle(
    'hidden',
    !currentPermissions.createBatches
  );

  $('profilePanel').classList.toggle(
    'hidden',
    !currentPermissions.editProfiles
  );

  $('usersPanel').classList.toggle(
    'hidden',
    !currentPermissions.manageUsers
  );

  if (currentPermissions.manageUsers) {
    loadUsers();
  }
}

async function logout() {
  try {
    await api('logout', { token: token });
  } catch (error) {
    // Clear the local session even if the server is unavailable.
  }

  token = '';
  sessionStorage.removeItem(SESSION_KEY);
  currentUser = null;
  currentItem = null;

  stopCamera();

  $('itemPanel').classList.add('hidden');
  showLogin();
  status('Logged out.');
}

/* ================= ITEM LOOKUP ================= */

async function findItem(value) {
  const barcode = String(value || $('barcode').value).trim();

  if (!barcode) {
    status('Enter a barcode.');
    return;
  }

  if (!currentPermissions.scan) {
    status('Your account cannot scan or look up items.');
    return;
  }

  try {
    status('Looking up item…');

    const result = await api('lookup', {
      barcode: barcode,
      token: token
    });

    if (!result.success) {
      throw new Error(result.message);
    }

    renderItem(result);
    status('Item found.');
  } catch (error) {
    status(error.message);
  }
}

function renderItem(result) {
  currentItem = result;

  $('itemPanel').classList.remove('hidden');
  $('itemName').textContent = result.item.name || 'Unnamed item';

  $('itemDetails').innerHTML =
    '<p><b>Item ID:</b> ' + esc(result.item.id) +
    '<br><b>Barcode:</b> ' + esc(result.item.barcode) +
    '<br><b>Entered:</b> ' + esc(result.item.dateEntered) +
    '<br><b>On hand:</b> ' + esc(result.item.onHand) +
    ' ' + esc(result.item.unit || '') +
    '<br><b>Category:</b> ' + esc(result.item.category || '') +
    '<br><b>Manufacturer:</b> ' + esc(result.item.manufacturer || '') +
    '<br><b>Location:</b> ' + esc(result.item.location || '') +
    '<br><b>Notes:</b> ' + esc(result.item.notes || '') +
    '</p>';

  const profile = result.profile || {};

  $('profileView').innerHTML =
    '<h2>Profile</h2>' +
    (profile.photoUrl
      ? '<img src="' + esc(profile.photoUrl) + '" alt="Item photo">'
      : '') +
    '<p><b>Uses:</b> ' + esc(profile.uses || '') +
    '<br><b>Warnings:</b> ' + esc(profile.warnings || '') +
    '<br><b>Instructions:</b> ' + esc(profile.instructions || '') +
    '<br><b>Special handling:</b> ' + esc(profile.handling || '') +
    '<br><b>Profile notes:</b> ' + esc(profile.notes || '') +
    '</p>';

  $('batches').innerHTML = '';
  $('batchSelect').innerHTML = '';

  (result.batches || []).forEach(function(batch) {
    const div = document.createElement('div');
    div.className = 'batch';

    div.innerHTML =
      '<b>' + esc(batch.lot || batch.id) + '</b>' +
      '<br>Batch ID: ' + esc(batch.id) +
      '<br>Expires: ' + esc(batch.expiration || 'Not entered') +
      '<br>Quantity: ' + esc(batch.quantity) +
      '<br>Status: ' + esc(batch.status || '') +
      '<br>Barcode: ' + esc(batch.barcode || '');

    $('batches').appendChild(div);

    const option = document.createElement('option');
    option.value = batch.id;
    option.textContent =
      (batch.lot || batch.id) +
      ' — ' + batch.quantity + ' on hand' +
      (batch.expiration ? ' — exp ' + batch.expiration : '');

    if (batch.selected) {
      option.selected = true;
    }

    $('batchSelect').appendChild(option);
  });

  if (result.selectedBatchId) {
    $('batchSelect').value = result.selectedBatchId;
  }

  $('txnType').innerHTML = '';

  if (currentPermissions.receive) {
    $('txnType').add(new Option('Receive stock', 'Receive'));
  }

  if (currentPermissions.remove) {
    $('txnType').add(new Option('Remove stock', 'Remove'));
  }

  if (currentPermissions.receive || currentPermissions.remove) {
    $('stockPanel').classList.remove('hidden');
  } else {
    $('stockPanel').classList.add('hidden');
  }

  $('newLot').value = '';
  $('newQuantity').value = '';
  $('newReceived').value = new Date().toISOString().slice(0, 10);

  $('pUses').value = profile.uses || '';
  $('pWarnings').value = profile.warnings || '';
  $('pInstructions').value = profile.instructions || '';
  $('pHandling').value = profile.handling || '';
  $('pNotes').value = profile.notes || '';
  $('pPhoto').value = profile.photoUrl || '';
}

function esc(value) {
  return String(value == null ? '' : value).replace(
    /[&<>"']/g,
    function(character) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[character];
    }
  );
}

/* ================= STOCK TRANSACTION ================= */

async function submitTransaction() {
  if (!currentItem) return;

  const type = $('txnType').value;
  const quantity = Number($('txnQty').value);
  const batchId = $('batchSelect').value;

  if (!batchId) {
    status('Select a specific batch before changing stock.');
    return;
  }

  if (!Number.isSafeInteger(quantity) || quantity <= 0) {
    status('Enter a positive whole-number quantity.');
    return;
  }

  try {
    status('Saving stock transaction…');

    const result = await api('transaction', {
      token: token,
      request: {
        itemId: currentItem.item.id,
        batchId: batchId,
        type: type,
        quantity: quantity,
        reason: $('txnReason').value,
        requestId: requestId()
      }
    });

    if (!result.success) {
      throw new Error(result.message);
    }

    status(result.message);
    await findItem(currentItem.item.barcode);
  } catch (error) {
    status(error.message);
  }
}

/* ================= NEW BATCH ================= */

async function createBatch() {
  if (!currentItem) return;

  const quantity = Number($('newQuantity').value);

  if (!Number.isSafeInteger(quantity) || quantity <= 0) {
    status('Enter a positive whole-number quantity.');
    return;
  }

  try {
    status('Creating batch…');

    const result = await api('newBatch', {
      token: token,
      request: {
        itemId: currentItem.item.id,
        lot: $('newLot').value,
        receivedDate: $('newReceived').value,
        expirationDate: $('newExpiration').value,
        quantity: quantity,
        supplier: $('newSupplier').value,
        location: $('newLocation').value,
        notes: $('newNotes').value,
        requestId: requestId()
      }
    });

    if (!result.success) {
      throw new Error(result.message);
    }

    status(
      result.message + ' Batch barcode: ' + result.batchBarcode
    );

    await findItem(currentItem.item.barcode);
  } catch (error) {
    status(error.message);
  }
}

/* ================= SAVE ITEM PROFILE ================= */

async function saveProfile() {
  if (!currentItem) return;

  try {
    const result = await api('profileSave', {
      token: token,
      request: {
        itemId: currentItem.item.id,
        uses: $('pUses').value,
        warnings: $('pWarnings').value,
        instructions: $('pInstructions').value,
        handling: $('pHandling').value,
        notes: $('pNotes').value,
        photoUrl: $('pPhoto').value
      }
    });

    if (!result.success) {
      throw new Error(result.message);
    }

    status(result.message);
    await findItem(currentItem.item.barcode);
  } catch (error) {
    status(error.message);
  }
}

/* ================= CAMERA SCANNER ================= */

async function startCamera() {
  try {
    if (!scanner) {
      scanner = new Html5Qrcode('reader');
    }

    const cameras = await Html5Qrcode.getCameras();

    if (!cameras.length) {
      throw new Error('No camera was found.');
    }

    await scanner.start(
      cameras[0].id,
      {
        fps: 10,
        qrbox: { width: 250, height: 180 }
      },
      function(decodedText) {
        stopCamera();
        $('barcode').value = decodedText;
        findItem(decodedText);
      },
      function() {}
    );

    status('Camera scanning.');
  } catch (error) {
    status('Camera error: ' + error.message);
  }
}

async function stopCamera() {
  if (scanner) {
    try {
      if (scanner.isScanning) {
        await scanner.stop();
      }
    } catch (error) {}

    try {
      await scanner.clear();
    } catch (error) {}
  }
}

/* ================= OWNER USER MANAGEMENT ================= */

async function loadUsers() {
  try {
    const result = await api('usersList', {
      token: token
    });

    if (!result.success) {
      throw new Error(result.message);
    }

    $('usersList').innerHTML = '';

    result.users.forEach(function(user) {
      const div = document.createElement('div');
      div.className = 'batch';

      div.innerHTML =
        '<b>' + esc(user.displayName) + '</b> — ' +
        esc(user.email) +
        '<br>Role: ' + esc(user.role) +
        ' | ' + (user.active ? 'Active' : 'Inactive') +
        '<br><button class="secondary" type="button">Edit this account</button>';

      div.querySelector('button').onclick = function() {
        editUser(user);
      };

      $('usersList').appendChild(div);
    });
  } catch (error) {
    status(error.message);
  }
}

let editingUserEmail = '';

const PERMISSION_COLUMNS_JS = {
  scan: 'Can scan / look up items',
  receive: 'Receive stock',
  remove: 'Remove stock',
  createBatches: 'Create new batches',
  editProfiles: 'Edit item profiles'
};

function editUser(user) {
  editingUserEmail = user.email;

  $('uEmail').value = user.email;
  $('uEmail').disabled = true;
  $('uName').value = user.displayName;
  $('uPin').value = '';
  $('uActive').checked = user.active;

  Object.keys(PERMISSION_COLUMNS_JS).forEach(function(key) {
    const element = $('perm_' + key);

    if (element) {
      element.checked = !!user.permissions[key];
    }
  });
}

$('permissionInputs').innerHTML =
  Object.entries(PERMISSION_COLUMNS_JS).map(function(entry) {
    const key = entry[0];
    const label = entry[1];

    return (
      '<label class="checkline">' +
      '<input type="checkbox" id="perm_' + key + '">' +
      ' ' + label +
      '</label>'
    );
  }).join('');

async function saveUser() {
  const permissions = {};

  Object.keys(PERMISSION_COLUMNS_JS).forEach(function(key) {
    permissions[key] = $('perm_' + key).checked;
  });

  try {
    const result = await api('userSave', {
      token: token,
      request: {
        email: $('uEmail').value,
        displayName: $('uName').value,
        pin: $('uPin').value,
        active: $('uActive').checked,
        permissions: permissions
      }
    });

    if (!result.success) {
      throw new Error(result.message);
    }

    status(result.message);

    editingUserEmail = '';
    $('uEmail').disabled = false;
    $('uEmail').value = '';
    $('uName').value = '';
    $('uPin').value = '';

    loadUsers();
  } catch (error) {
    status(error.message);
  }
}

/* ================= STARTUP ================= */

$('pin').addEventListener('keydown', function(event) {
  if (event.key === 'Enter') {
    login();
  }
});

validate();
</script>
</body>
</html>
